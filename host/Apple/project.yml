# XcodeGen spec for the iPhone/iPad app and its companion Apple Watch app.
# `make apple-project` generates FliBuddy.xcodeproj here; the project is
# not checked in. The apps are thin shells over the local Swift package in
# `host/`: all logic lives in FliBuddyCore, the views in FliBuddyUI.
name: FliBuddy
options:
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
  createIntermediateGroups: true
configFiles:
  # Base.xcconfig optionally includes the git-ignored Signing.xcconfig
  # (copy Signing.example.xcconfig and fill in DEVELOPMENT_TEAM).
  Debug: Base.xcconfig
  Release: Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  FliBuddy:
    path: ..
targets:
  FliBuddyiOS:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - iOS
    dependencies:
      - package: FliBuddy
        product: FliBuddyCore
      - package: FliBuddy
        product: FliBuddyUI
      # Embedded, so the watch app installs from the iPhone.
      - target: FliBuddyWatch
    settings:
      base:
        # The owner's domain; a placeholder until the apps get an Apple
        # Developer account.
        PRODUCT_BUNDLE_IDENTIFIER: com.sokolachko.flibuddy
        PRODUCT_NAME: FliBuddy
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        # Merged with the generated keys: UIBackgroundModes, an array, which
        # INFOPLIST_KEY_* settings cannot express. No App Transport Security
        # exception: the apps talk HTTPS only.
        INFOPLIST_FILE: iOS/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: FliBuddy
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: FliBuddy connects to the Flipper Zero over Bluetooth to read spool tags.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: FliBuddy talks to your Bambuddy server on the local network.
        INFOPLIST_KEY_NSCameraUsageDescription: FliBuddy scans the API-key QR code shown by Bambuddy.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
  FliBuddyWatch:
    type: application
    platform: watchOS
    deploymentTarget: "26.0"
    sources:
      - Watch
    dependencies:
      - package: FliBuddy
        product: FliBuddyCore
      - package: FliBuddy
        product: FliBuddyUI
    settings:
      base:
        # A companion's bundle id extends the iPhone app's.
        PRODUCT_BUNDLE_IDENTIFIER: com.sokolachko.flibuddy.watchkitapp
        PRODUCT_NAME: FliBuddyWatch
        TARGETED_DEVICE_FAMILY: "4"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: FliBuddy
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.sokolachko.flibuddy
        # Bluetooth only while the app is open, so no WKBackgroundModes.
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: FliBuddy connects to the Flipper Zero over Bluetooth to read spool tags.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown
