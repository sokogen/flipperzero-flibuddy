# XcodeGen spec for the iPhone/iPad app and its companion Apple Watch app.
# `make apple-project` generates SpoolBuddy.xcodeproj here; the project is
# not checked in. The apps are thin shells over the local Swift package in
# `host/`: all logic lives in SpoolBuddyCore, the views in SpoolBuddyUI.
name: SpoolBuddy
options:
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
  createIntermediateGroups: true
configFiles:
  # Base.xcconfig optionally includes the git-ignored Signing.xcconfig
  # (copy Signing.example.xcconfig and fill in DEVELOPMENT_TEAM).
  Debug: Base.xcconfig
  Release: Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  SpoolBuddy:
    path: ..
targets:
  SpoolBuddyiOS:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - iOS
    dependencies:
      - package: SpoolBuddy
        product: SpoolBuddyCore
      - package: SpoolBuddy
        product: SpoolBuddyUI
      # Embedded, so the watch app installs from the iPhone.
      - target: SpoolBuddyWatch
    settings:
      base:
        # Placeholder until the apps get an Apple Developer account.
        PRODUCT_BUNDLE_IDENTIFIER: cool.bambuddy.spoolbuddy
        PRODUCT_NAME: SpoolBuddy
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        # Merged with the generated keys: the App Transport Security
        # exception for Bambuddy's plain-HTTP URL, which INFOPLIST_KEY_*
        # settings cannot express.
        INFOPLIST_FILE: iOS/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: SpoolBuddy
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: SpoolBuddy connects to the Flipper Zero over Bluetooth to read spool tags.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: SpoolBuddy talks to your Bambuddy server on the local network.
        INFOPLIST_KEY_NSCameraUsageDescription: SpoolBuddy scans the API-key QR code shown by Bambuddy.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
  SpoolBuddyWatch:
    type: application
    platform: watchOS
    deploymentTarget: "26.0"
    sources:
      - Watch
    dependencies:
      - package: SpoolBuddy
        product: SpoolBuddyCore
      - package: SpoolBuddy
        product: SpoolBuddyUI
    settings:
      base:
        # A companion's bundle id extends the iPhone app's.
        PRODUCT_BUNDLE_IDENTIFIER: cool.bambuddy.spoolbuddy.watchkitapp
        PRODUCT_NAME: SpoolBuddyWatch
        TARGETED_DEVICE_FAMILY: "4"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: YES
        # The App Transport Security exception, as on the iPhone.
        INFOPLIST_FILE: Watch/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: SpoolBuddy
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: cool.bambuddy.spoolbuddy
        # Bluetooth only while the app is open, so no WKBackgroundModes.
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: SpoolBuddy connects to the Flipper Zero over Bluetooth to read spool tags.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown
