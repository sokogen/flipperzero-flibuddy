[project]
name = "flibuddy-tools"
version = "0.1.0"
description = "Dev bridge and fixture tools for flipper-flibuddy"
requires-python = ">=3.13"
dependencies = [
  "pyserial>=3.5",
  "httpx>=0.27",
  "jsonschema>=4.23",
]

[dependency-groups]
dev = [
  "pillow>=13.0.0",
  "pytest>=8.3",
  "pytest-cov>=7.1.0",
  "pyyaml>=6.0.3",
  "ruff>=0.17.2",
  "segno>=1.6.6",
  "zxing-cpp>=3.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["bambu_keys", "bridge", "fixtures", "swift_coverage"]

[tool.coverage.report]
fail_under = 80
show_missing = true
