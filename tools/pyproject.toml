[project]
name = "spoolbuddy-tools"
version = "0.1.0"
description = "Dev bridge and fixture tools for flipper-spoolbuddy"
requires-python = ">=3.13"
dependencies = [
  "pyserial>=3.5",
  "httpx>=0.27",
  "jsonschema>=4.23",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
