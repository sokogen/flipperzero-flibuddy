name: host

on:
  push:
    branches: [main]
    paths:
      - "host/**"
      - "protocol/**"
      # The coverage gate below runs this script.
      - "tools/swift_coverage.py"
      - ".github/workflows/host.yml"
  pull_request:
    paths:
      - "host/**"
      - "protocol/**"
      - "tools/swift_coverage.py"
      - ".github/workflows/host.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build (warnings fail)
        working-directory: host
        run: swift build -Xswiftc -warnings-as-errors
      - name: Swift tests
        working-directory: host
        run: swift test --enable-code-coverage
      - name: SpoolBuddyCore line coverage >= 80 %
        working-directory: tools
        run: uv run python swift_coverage.py "$(cd ../host && swift test --show-codecov-path)" --min 80
