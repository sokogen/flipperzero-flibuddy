name: tools

on:
  push:
    branches: [main]
    paths:
      - "tools/**"
      - "protocol/**"
      # tools/tests check these against their generators.
      - "flipper/tests/vectors/**"
      - "docs/design/icons/**"
      - "flipper/icons/**"
      - "host/Apple/**/Assets.xcassets/**"
      - ".github/workflows/tools.yml"
  pull_request:
    paths:
      - "tools/**"
      - "protocol/**"
      - "flipper/tests/vectors/**"
      - "docs/design/icons/**"
      - "flipper/icons/**"
      - "host/Apple/**/Assets.xcassets/**"
      - ".github/workflows/tools.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install librsvg
        working-directory: tools
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin
      - name: Install dependencies
        working-directory: tools
        run: uv sync
      - name: Python tests
        working-directory: tools
        run: uv run pytest --cov
      - name: Lint
        working-directory: tools
        run: uv run ruff check
