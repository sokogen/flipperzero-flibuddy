name: tools

on:
  push:
    branches: [main]
    paths:
      - "tools/**"
      - "protocol/**"
      # tools/tests check these against their generators.
      - "flipper/tests/vectors/**"
      - ".github/workflows/tools.yml"
  pull_request:
    paths:
      - "tools/**"
      - "protocol/**"
      - "flipper/tests/vectors/**"
      - ".github/workflows/tools.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        working-directory: tools
        run: uv sync
      - name: Python tests
        working-directory: tools
        run: uv run pytest
