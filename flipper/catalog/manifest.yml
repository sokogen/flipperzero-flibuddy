# Draft of the Flipper Apps Catalog manifest. At submission it goes to the
# catalog repository as applications/NFC/flibuddy/manifest.yml, with
# commit_sha set to the full 40-character sha of the submitted commit.
# name, id, version, category, author and icon come from application.fam.
sourcecode:
  type: git
  location:
    origin: https://github.com/sokogen/flipperzero-flibuddy.git
    commit_sha: FILLED-AT-SUBMISSION
    subdir: flipper
short_description: "Reads Bambu Lab spool NFC tags; logs spools and weights to Bambuddy via the FliBuddy iPhone app"
description: "@catalog/description.md"
changelog: "@CHANGELOG.md"
# Unedited qFlipper exports; the first is the preview (screenshots/README.md).
screenshots:
  - screenshots/1_no_app.png
  - screenshots/2_spool.png
  - screenshots/3_waiting.png
  - screenshots/4_new_spool.png
  - screenshots/5_weight.png
  - screenshots/6_settings.png
